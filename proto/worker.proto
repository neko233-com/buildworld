syntax = "proto3";

package worker;

option go_package = "github.com/neko233-com/buildworld/internal/rpc/generated";

service WorkerService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ExecuteBuild(BuildRequest) returns (stream BuildResponse);
  rpc ReportStatus(StatusRequest) returns (StatusResponse);
}

// ProtocolInfo is the mandatory bytemsg233 contract carried by every remote
// execution request and response. Major 1 is BuildWorld's first public worker
// protocol. Each peer must declare every capability required by the current
// execution formats; a new major means incompatible semantics.
message ProtocolInfo {
  string name = 1;
  uint32 major = 2;
  uint32 minor = 3;
  repeated string capabilities = 4;
}

message RegisterRequest {
  string worker_id = 1;
  string name = 2;
  string address = 3;
  string token = 4;
  repeated string labels = 5;
  int32 max_concurrent_builds = 6;
}

message RegisterResponse {
  bool success = 1;
  string message = 2;
}

message HeartbeatRequest {
  string worker_id = 1;
  float cpu_usage = 2;
  float memory_usage = 3;
  float disk_usage = 4;
  int32 active_builds = 5;
}

message HeartbeatResponse {
  bool acknowledged = 1;
}

message BuildRequest {
  string build_id = 1;
  string project_name = 2;
  string repo_url = 3;
  string branch = 4;
  string commit_sha = 5;
  string pipeline_config = 6;
  map<string, string> environment = 7;
  reserved 8;
  reserved "protocol_version";
  repeated PluginReference plugins = 9;
  // Required. Missing or incompatible protocol information rejects execution.
  ProtocolInfo protocol = 10;
}

// PluginReference never carries executable code. The worker resolves the
// approved GitHub source locally, then verifies this manifest digest before a
// custom Go plugin step can run.
message PluginReference {
  string name = 1;
  string version = 2;
  string source = 3;
  string manifest_sha256 = 4;
}

message BuildResponse {
  string build_id = 1;
  string stage = 2;
  string step = 3;
  string output = 4;
  string status = 5;
  bool is_error = 6;
  ArtifactChunk artifact_chunk = 7;
  // Required on every streamed response.
  ProtocolInfo protocol = 8;
}

// ArtifactChunk carries one ordered piece of a worker artifact. Keeping the
// chunk below gRPC's default message limit lets workers return large artifacts
// without requiring an inbound HTTP route to buildworld-server.
message ArtifactChunk {
  string name = 1;
  bytes data = 2;
  bool final_chunk = 3;
  string sha256 = 4;
}

message StatusRequest {
  string worker_id = 1;
}

message StatusResponse {
  string worker_id = 1;
  string status = 2;
  int32 active_builds = 3;
  int32 max_builds = 4;
}
