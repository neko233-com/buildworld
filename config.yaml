server:
  host: "0.0.0.0"
  port: 8700

database:
  path: "./data/buildworld.db"

auth:
  jwt_secret: ""

plugins:
  path: "./plugins"

storage:
  # Disposable workspaces and Go/Node caches are resolved beside the binary.
  build_temp: "./build_temp"
  artifacts: "./artifacts"

workers:
  # Required for remote worker auto-registration. Keep this secret in production.
  enrollment_token: ""
  local:
    # Low-resource development default. Change live under Settings > Runtime.
    max_concurrent_builds: 1
    workspace: "./workspace"
    labels: []
# GitHub, GitLab, and Gitea webhooks can deliver signed push events here.
# Matching repository pushes create normal project builds.
automation:
  github_webhook_secret: ""
