name: Notify Buildworld development server

on:
  push:
    branches: [main, develop]

jobs:
  notify-buildworld:
    if: contains(github.event.head_commit.message, '[buildworld:restart]')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Buildworld webhook
        env:
          BUILDWORLD_WEBHOOK_URL: ${{ secrets.BUILDWORLD_WEBHOOK_URL }}
          BUILDWORLD_WEBHOOK_SECRET: ${{ secrets.BUILDWORLD_WEBHOOK_SECRET }}
          PAYLOAD: ${{ toJson(github.event) }}
        run: |
          signature="sha256=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$BUILDWORLD_WEBHOOK_SECRET" -hex | sed 's/^.* //')"
          curl --fail-with-body --request POST "$BUILDWORLD_WEBHOOK_URL/api/webhooks/github" \
            --header "Content-Type: application/json" \
            --header "X-Hub-Signature-256: $signature" \
            --data "$PAYLOAD"
