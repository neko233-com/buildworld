name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      
      - name: Run Go tests
        run: go test ./...
      
      - name: Run Go vet
        run: go vet ./...
      
      - name: Build all binaries
        run: |
          go build -o buildworld233 ./cmd/server
          go build -o buildworld233-agent ./cmd/worker
          go build -o bwctl ./cmd/cli
      
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build
          npm run test
      
      - name: Verify binary sizes
        run: |
          ls -lh buildworld233 buildworld233-agent bwctl
          echo "All binaries built successfully"
