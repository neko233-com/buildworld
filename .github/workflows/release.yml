name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      
      - name: Build all binaries
        run: |
          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -o buildworld233-linux-amd64 ./cmd/server
          GOOS=linux GOARCH=amd64 go build -o buildworld233-agent-linux-amd64 ./cmd/worker
          
          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -o buildworld233-linux-arm64 ./cmd/server
          GOOS=linux GOARCH=arm64 go build -o buildworld233-agent-linux-arm64 ./cmd/worker
          
          # macOS amd64
          GOOS=darwin GOARCH=amd64 go build -o buildworld233-darwin-amd64 ./cmd/server
          GOOS=darwin GOARCH=amd64 go build -o buildworld233-agent-darwin-amd64 ./cmd/worker
          
          # macOS arm64
          GOOS=darwin GOARCH=arm64 go build -o buildworld233-darwin-arm64 ./cmd/server
          GOOS=darwin GOARCH=arm64 go build -o buildworld233-agent-darwin-arm64 ./cmd/worker
          
          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -o buildworld233-windows-amd64.exe ./cmd/server
          GOOS=windows GOARCH=amd64 go build -o buildworld233-agent-windows-amd64.exe ./cmd/worker
          
          # Windows arm64
          GOOS=windows GOARCH=arm64 go build -o buildworld233-windows-arm64.exe ./cmd/server
          GOOS=windows GOARCH=arm64 go build -o buildworld233-agent-windows-arm64.exe ./cmd/worker
          
          ls -lh buildworld233*
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            buildworld233-*
            buildworld233-agent-*
